<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Nikhil Sai Nambula - Software Developer, Distributed Systems">
  <defs>
    <style>
      @font-face { font-family: 'CG'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 900; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #t1c { animation: t1w 6s steps(8) forwards; width: 0; }
      @keyframes t1w { 0% { width: 0; } 14%, 100% { width: 96px; } }
      #whoami { opacity: 0; animation: show 6s forwards; }
      @keyframes show { 0%, 1% { opacity: 0; } 2%, 100% { opacity: 1; } }
      #nm { opacity: 0; transform: translateY(14px); animation: rise 6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      @keyframes rise { 0%, 18% { opacity: 0; transform: translateY(14px); } 30%, 100% { opacity: 1; transform: translateY(0); } }
      #slash { stroke-dasharray: 224; stroke-dashoffset: 224; animation: draw 6s ease-out forwards; }
      @keyframes draw { 0%, 32% { stroke-dashoffset: 224; } 44%, 100% { stroke-dashoffset: 0; } }
      #t2c { animation: t2w 6s steps(40) forwards; width: 0; }
      @keyframes t2w { 0%, 46% { width: 0; } 82%, 100% { width: 470px; } }
      #sub { opacity: 0; animation: show2 6s forwards; }
      @keyframes show2 { 0%, 45% { opacity: 0; } 46%, 100% { opacity: 1; } }
      #cur { opacity: 0; animation: curshow 6s forwards, blink 1.1s steps(2, jump-none) 6s infinite; }
      @keyframes curshow { 0%, 80% { opacity: 0; } 82%, 100% { opacity: 1; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      #meta { opacity: 0; animation: metafade 6s ease-out forwards; }
      @keyframes metafade { 0%, 84% { opacity: 0; } 94%, 100% { opacity: 1; } }
    </style>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="rgba(255,255,255,0.045)" />
    </pattern>
    <radialGradient id="glow" cx="0.12" cy="0.1" r="0.9">
      <stop offset="0%" stop-color="rgba(16,185,129,0.10)" />
      <stop offset="55%" stop-color="rgba(16,185,129,0.02)" />
      <stop offset="100%" stop-color="rgba(16,185,129,0)" />
    </radialGradient>
    <clipPath id="t1clip"><rect id="t1c" x="48" y="40" height="26" /></clipPath>
    <clipPath id="t2clip"><rect id="t2c" x="48" y="176" height="28" /></clipPath>
  </defs>

  <rect width="900" height="240" rx="20" fill="#0b0b0f" />
  <rect width="900" height="240" rx="20" fill="url(#dots)" />
  <rect width="900" height="240" rx="20" fill="url(#glow)" />
  <rect x="0.75" y="0.75" width="898.5" height="238.5" rx="19.5" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5" />

  <g id="whoami" class="mono" font-size="18">
    <text x="48" y="60" fill="#34d399" clip-path="url(#t1clip)">$ whoami</text>
  </g>

  <g id="nm">
    <text x="46" y="138" font-family="CG" font-weight="900" font-size="54" letter-spacing="0.5" fill="#fafafa">NIKHIL SAI NAMBULA</text>
    <line id="slash" x1="50" y1="160" x2="274" y2="160" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  </g>

  <g id="sub" class="mono" font-size="19">
    <text x="48" y="197" fill="#a1a1aa" clip-path="url(#t2clip)">Software Developer · Distributed Systems</text>
  </g>
  <rect id="cur" x="524" y="181" width="11" height="21" fill="#34d399" />

  <g id="meta" class="mono" font-size="12.5" fill="#71717a">
    <text x="48" y="228">17.4485° N, 78.3756° E</text>
  </g>
</svg>
