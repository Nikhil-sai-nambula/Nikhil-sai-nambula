<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" role="img" aria-label="">
  <defs>
    <style>
      #dot { animation: travel 7s linear infinite; }
      @keyframes travel {
        0% { transform: translateX(0); opacity: 0; }
        6% { opacity: 1; }
        94% { opacity: 1; }
        100% { transform: translateX(900px); opacity: 0; }
      }
    </style>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(52,211,153,0)" />
      <stop offset="18%" stop-color="rgba(52,211,153,0.28)" />
      <stop offset="82%" stop-color="rgba(52,211,153,0.28)" />
      <stop offset="100%" stop-color="rgba(52,211,153,0)" />
    </linearGradient>
    <filter id="soft" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.6" />
    </filter>
  </defs>
  <rect x="0" y="13.5" width="900" height="1" fill="url(#line)" />
  <g id="dot">
    <circle cx="0" cy="14" r="6" fill="rgba(52,211,153,0.45)" filter="url(#soft)" />
    <circle cx="0" cy="14" r="2.6" fill="#34d399" />
  </g>
</svg>
